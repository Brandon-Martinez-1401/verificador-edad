<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificador de edad</title>
</head>
<body>

    <h1>Verificador de edad</h1>

    <label for="campoEdad">Ingresa tu edad:</label>
    <input type="number" id="campoEdad" min="0" placeholder="Ej. 25">
    <button onclick="verificarEdad()">Verificar</button>

    <script>
        function verificarEdad() {
            let inputEdad = document.getElementById("campoEdad");
            let valorInput = inputEdad.value;

            if (valorInput === "") {
                alert("Por favor, ingresa tu edad. El campo no puede estar vacío.");
            } else if (isNaN(valorInput) || valorInput < 0) {
                alert("Por favor, ingresa un número válido mayor o igual a cero.");
            } else if (valorInput >= 18) {
                alert("Eres mayor de edad");
            } else {
                alert("Eres menor de edad");
            }
        }
    </script>

</body>
</html>
